<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Pago - Mentorías</title>
    <link rel="stylesheet" href="pago.css">
</head>
<body>
    <div class="container">
        <h1>Test de Sistema de Pago</h1>
        
        <form id="formulario-pago" class="formulario-pago">
            <div class="datos-comprador">
                <h2>Datos del Cliente</h2>
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" value="Juan Pérez" required>
                
                <label for="correo">Email:</label>
                <input type="email" id="correo" name="correo" value="juan@example.com" required>
                
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" value="12345678" required>
            </div>

            <div class="metodo-pago">
                <h2>Método de Pago</h2>
                
                <label>
                    <input type="radio" name="pago" value="tarjeta"> Tarjeta de Crédito/Débito
                </label>
                
                <label>
                    <input type="radio" name="pago" value="transferencia"> Transferencia Bancaria
                </label>
                
                <label>
                    <input type="radio" name="pago" value="mercado" checked> MercadoPago
                </label>

                <!-- Campos específicos para cada método -->
                <div id="campos-tarjeta" style="display: none;">
                    <p>Campos de tarjeta aparecerán aquí</p>
                </div>

                <div id="campos-transferencia" style="display: none;">
                    <p>Información de transferencia aparecerá aquí</p>
                </div>

                <div id="campos-mercado" style="display: block;">
                    <div id="cardPaymentBrick_container"></div>
                </div>
            </div>
        </form>

        <!-- Contenedor para mensajes -->
        <div id="mensaje-container"></div>
    </div>

    <!-- Cargar configuración y scripts -->
    <script src="config.js"></script>
    <script src="pago.js"></script>
</body>
</html>
